apiVersion: apps/v1
kind: Deployment
metadata:
  name: medifollow-backend-deployment
  namespace: medifollow-staging
  labels:
    app: medifollow-backend
spec:
  replicas: 2
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: medifollow-backend
  template:
    metadata:
      labels:
        app: medifollow-backend
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
        options:
          - name: ndots
            value: "1"
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      containers:
      - name: medifollow-backend
        # Replaced by Jenkins (DOCKER_USER/Medifollow-Back-CD) — never bare "name:tag"
        image: REPLACE_DOCKER_USER/medifollow-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: medifollow-secrets
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
